name: Pepper
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.darrell
  createIntermediateGroups: true
  groupSortPosition: top

# Sparkle — auto-update framework. Releases are served by Orbis from
# https://sbsorbis.com/download/pepper/ (appcast, update zips, DMGs),
# the same way Muesli ships. See README for the release workflow. Pinned exactly: `from:` let each clean build resolve
# whatever Sparkle was newest that day (Package.resolved isn't
# committed), so two builds of the same commit could ship different
# updaters. Bump deliberately.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.1"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    # Manual signing with the Developer ID Application cert — keeps TCC
    # grants stable across rebuilds (ad-hoc signing reshuffles the
    # CDHash every compile which re-prompts for Screen Recording /
    # Accessibility / Camera / Mic every time).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: "8B29CDK832"
    # Bump MARKETING_VERSION for each release. scripts/release.sh
    # overrides CURRENT_PROJECT_VERSION with a UTC timestamp
    # (YYYYMMDDHHMM): Sparkle orders updates by it, and the Orbis
    # download page picks the newest release by comparing it as text,
    # so every release build number must be that same fixed width.
    MARKETING_VERSION: "1.2.3"
    # Cobalt (SBS brand) as the app-wide tint: selection, switches,
    # sliders, prominent buttons — as in Muesli.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pepper:
    type: application
    platform: macOS
    sources:
      - path: Pepper
        excludes:
          - "**/*.entitlements"
          - "Resources/Info.plist"
          - "Resources/Fonts/**"
      # Bundled SBS brand typeface (Nantes Light, as in Muesli), copied as
      # a folder to Contents/Resources/Fonts (ATSApplicationFontsPath).
      - path: Pepper/Resources/Fonts
        type: folder
        buildPhase: resources
    resources:
      - path: Pepper/Resources/Assets.xcassets
        optional: true
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: Metal.framework
      - sdk: Carbon.framework
      - package: Sparkle
    info:
      path: Pepper/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pepper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        ATSApplicationFontsPath: Fonts
        NSCameraUsageDescription: Pepper records your webcam to overlay it on screen recordings.
        NSMicrophoneUsageDescription: Pepper records your microphone for narration.
        NSSpeechRecognitionUsageDescription: Pepper transcribes your narration on-device to generate subtitles for the recording.
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: © 2026 Darrell Etherington
        # ---- Sparkle auto-update ----------------------------------
        # Appcast feed, public on Orbis (Sparkle can't sign in).
        SUFeedURL: "https://sbsorbis.com/download/pepper/appcast.xml"
        # EdDSA public key for verifying update signatures. Generated
        # once with Sparkle's `generate_keys`; the private key stays in
        # the developer's keychain. If you ever rotate, replace this
        # key + re-sign every live appcast entry at the same time.
        SUPublicEDKey: "ODjAca9kR1OJ8SuY35WtdhSjO7BM+sPltxEVWNBjqyo="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # -----------------------------------------------------------
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pepper Recording
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.darrell.pepper.recording
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.darrell.pepper.recording
            UTTypeDescription: Pepper Recording
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - pepper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darrell.pepper
        PRODUCT_NAME: Pepper
        CODE_SIGN_ENTITLEMENTS: Pepper/Resources/Pepper.entitlements
